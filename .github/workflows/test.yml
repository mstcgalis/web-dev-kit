name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix flake check
      - run: nix build .#wdk
      - run: nix develop -c sh -c 'bun install --frozen-lockfile && bun test'
      # Every engine on a non-NixOS Linux: the Firefox sandbox and WebKit EGL fixes live or die here.
      - run: nix develop -c sh -c 'cd test/project && bun ../../bin/wdk.js smoke --skip "^/broken" --engines chromium,firefox,webkit'
